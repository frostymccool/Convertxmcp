# A throwaway ConvertX for the integration suite.
#
# Runs anonymously so the tests need no account setup, and keeps its data in a
# tmpfs so nothing survives the run.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   CONVERTX_IT_BASE_URL=http://127.0.0.1:2311 \
#   CONVERTX_IT_UNAUTHENTICATED=true npm run test:integration
#   docker compose -f docker-compose.test.yml down -v
#
# Published on 2311, deliberately NOT the 2310 used by the production stack, so
# the suite can run while the real deployment is up without colliding with it.

services:
  convertx:
    image: ghcr.io/c4illin/convertx:latest
    environment:
      ALLOW_UNAUTHENTICATED: "true"
      HTTP_ALLOWED: "true"
      JWT_SECRET: integration-test-only-not-a-real-secret
    ports:
      - "127.0.0.1:2311:3000"
    tmpfs:
      - /app/data
    healthcheck:
      # The ConvertX image is debian-slim and ships curl, not wget. `/healthcheck`
      # is declared `auth: false` upstream, so it answers without a session.
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:3000/healthcheck
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
